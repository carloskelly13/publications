<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Publications — page layout and print design." />
    <meta name="theme-color" content="#44403c" />
    <link rel="icon" href="/publications-logo.svg" type="image/svg+xml" />
    <title>Publications</title>
    <script>
      (() => {
        const saved = localStorage.getItem('publications-theme')
        const theme = saved === 'light' || saved === 'dark' || saved === 'system' ? saved : 'system'
        const dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]').content = dark ? '#030712' : '#44403c'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
